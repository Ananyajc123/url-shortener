services:
  - type: web
    name: url-shortener-backend
    runtime: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dspring.profiles.active=prod -jar target/url-shortener-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: url-shortener-redis
          property: connectionString
      - key: JWT_SECRET
        value: url-shortener-production-secret-key-256-bits-minimum
      - key: BASE_URL
        value: https://url-shortener-backend.onrender.com
